services:
  chunkdb:
    image: chunkdb:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        CHUNKDB_WITH_TLS: "OFF"
    # Published on loopback only. Exposing the database to other hosts must be an
    # explicit operator decision: change this to "0.0.0.0:4242:4242" (and prefer
    # building with CHUNKDB_WITH_TLS=ON so the token is not sent in cleartext).
    ports:
      - "127.0.0.1:4242:4242"
    volumes:
      - chunkdb_data:/var/lib/chunkdb/data
    environment:
      # Deliberately has no default: a fallback credential here would be publicly
      # known. `docker compose up` fails fast until CHUNKDB_TOKEN is set.
      CHUNKDB_TOKEN: ${CHUNKDB_TOKEN:?set CHUNKDB_TOKEN to a strong secret (e.g. `export CHUNKDB_TOKEN=$(openssl rand -hex 32)`)}
      CHUNKDB_DURABILITY: ${CHUNKDB_DURABILITY:-relaxed}
      CHUNKDB_WORKERS: ${CHUNKDB_WORKERS:-4}
      CHUNKDB_DATA_DIR: ${CHUNKDB_DATA_DIR:-/var/lib/chunkdb/data}
      CHUNKDB_NOFILE_SOFT: ${CHUNKDB_NOFILE_SOFT:-65536}
      CHUNKDB_NOFILE_HARD: ${CHUNKDB_NOFILE_HARD:-65536}
    ulimits:
      nofile:
        soft: ${CHUNKDB_NOFILE_SOFT:-65536}
        hard: ${CHUNKDB_NOFILE_HARD:-65536}
    command:
      - "--listen-uri"
      - "chunk://0.0.0.0:4242/"
      - "--data-dir"
      - "${CHUNKDB_DATA_DIR:-/var/lib/chunkdb/data}"
      - "--durability"
      - "${CHUNKDB_DURABILITY:-relaxed}"
      - "--workers"
      - "${CHUNKDB_WORKERS:-4}"
    restart: unless-stopped

  chunkdb-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
      args:
        CHUNKDB_WITH_TLS: "OFF"
    command: ["ctest", "--test-dir", "build", "--output-on-failure"]

volumes:
  chunkdb_data:

services:
  chunkdb:
    image: chunkdb:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        CHUNKDB_WITH_TLS: "ON"
    # Published on loopback only. Exposing the database to other hosts must be an
    # explicit operator decision: change this to "0.0.0.0:4242:4242" (and prefer
    # building with CHUNKDB_WITH_TLS=ON so data does not travel in cleartext).
    ports:
      - "127.0.0.1:4242:4242"
    volumes:
      - chunkdb_data:/var/lib/chunkdb
    environment:
      CHUNKDB_ADMIN_USER: ${CHUNKDB_ADMIN_USER:-}
      CHUNKDB_ADMIN_PASSWORD: ${CHUNKDB_ADMIN_PASSWORD:-}
      CHUNKDB_DURABILITY: ${CHUNKDB_DURABILITY:-relaxed}
      CHUNKDB_WORKERS: ${CHUNKDB_WORKERS:-4}
      CHUNKDB_DATA_DIR: ${CHUNKDB_DATA_DIR:-/var/lib/chunkdb/data}
      CHUNKDB_NOFILE_SOFT: ${CHUNKDB_NOFILE_SOFT:-65536}
      CHUNKDB_NOFILE_HARD: ${CHUNKDB_NOFILE_HARD:-65536}
    ulimits:
      nofile:
        soft: ${CHUNKDB_NOFILE_SOFT:-65536}
        hard: ${CHUNKDB_NOFILE_HARD:-65536}
    command:
      - "--listen-uri"
      - "chunk://0.0.0.0:4242/"
      - "--data-dir"
      - "${CHUNKDB_DATA_DIR:-/var/lib/chunkdb/data}"
      - "--backup-dir"
      - "/var/lib/chunkdb/backups"
      - "--durability"
      - "${CHUNKDB_DURABILITY:-relaxed}"
      - "--workers"
      - "${CHUNKDB_WORKERS:-4}"
    restart: unless-stopped

  chunkdb-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
      args:
        CHUNKDB_WITH_TLS: "OFF"
        CHUNKDB_BUILD_TESTS: "ON"
    command: ["ctest", "--test-dir", "build", "--output-on-failure"]

volumes:
  chunkdb_data:

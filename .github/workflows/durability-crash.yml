name: Durability Crash Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # A change to documentation only does not run this workflow.
    paths-ignore: ["docs/**", "**.md", "bench/artifacts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crash-tests-posix:
    name: Crash Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: ccache
        uses: ./.github/actions/ccache
        with:
          name: crash

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCHUNKDB_BUILD_TESTS=ON
          -DCHUNKDB_WITH_TLS=OFF

      # Only the binaries of the crash-labelled tests (CHUNKDB_CRASH_TESTS in CMakeLists.txt).
      - name: Build Crash Targets
        run: >
          cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)" --target
          chunkdb_durability_crash_hardening_test chunkdb_snapshot_generation_linger_test chunkdb_txn_crash_test chunkdb_feed_slots_crash_test chunkdb_backup_crash_test chunkdb_restore_crash_test chunkdb_restore_table_crash_test chunkdb_migrations_crash_test chunkdb_chunk_coordinate_index_test chunkdb_table_tombstones_test chunkdb_commit_owner_artifact_io_test chunkdb_commit_group_coordinator_test chunkdb_recover_table_test chunkdb_version_clock_test chunkdb_expiry_test

      - name: Crash Label Tests
        run: ctest --test-dir build -L crash --output-on-failure
      - name: ccache statistics
        if: always()
        uses: ./.github/actions/ccache-stats

  crash-tests-windows:
    name: Crash Tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache

      - name: ccache
        uses: ./.github/actions/ccache
        with:
          name: crash-windows

      - name: Configure/Build/Crash Tests
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHUNKDB_BUILD_TESTS=ON -DCHUNKDB_WITH_TLS=OFF
          cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)" --target chunkdb_durability_crash_hardening_test chunkdb_snapshot_generation_linger_test chunkdb_txn_crash_test chunkdb_feed_slots_crash_test chunkdb_backup_crash_test chunkdb_restore_crash_test chunkdb_restore_table_crash_test chunkdb_migrations_crash_test chunkdb_chunk_coordinate_index_test chunkdb_table_tombstones_test chunkdb_commit_owner_artifact_io_test chunkdb_commit_group_coordinator_test chunkdb_recover_table_test chunkdb_version_clock_test
          ctest --test-dir build -L crash --output-on-failure
      - name: ccache statistics
        if: always()
        uses: ./.github/actions/ccache-stats

name: Durability Crash Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  crash-tests-posix:
    name: Crash Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCHUNKDB_BUILD_TESTS=ON
          -DCHUNKDB_WITH_TLS=OFF

      # Only the binaries of the crash-labelled tests (CHUNKDB_CRASH_TESTS in CMakeLists.txt).
      - name: Build Crash Targets
        run: >
          cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)" --target
          chunkdb_durability_crash_hardening_test chunkdb_snapshot_generation_linger_test chunkdb_txn_crash_test chunkdb_feed_slots_crash_test chunkdb_backup_crash_test chunkdb_restore_crash_test chunkdb_migrations_crash_test

      - name: Crash Label Tests
        run: ctest --test-dir build -L crash --output-on-failure

  crash-tests-windows:
    name: Crash Tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure/Build/Crash Tests
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHUNKDB_BUILD_TESTS=ON -DCHUNKDB_WITH_TLS=OFF
          cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)" --target chunkdb_durability_crash_hardening_test chunkdb_snapshot_generation_linger_test chunkdb_txn_crash_test chunkdb_feed_slots_crash_test chunkdb_backup_crash_test chunkdb_restore_crash_test chunkdb_migrations_crash_test
          ctest --test-dir build -L crash --output-on-failure

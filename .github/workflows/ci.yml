name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ccache only speeds up builds: without it they run uncached.
      - name: Install ccache
        timeout-minutes: 12
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            scripts/ci/apt-install.sh ccache || true
          elif command -v brew >/dev/null 2>&1; then
            brew install ccache || true
          fi
          if command -v ccache >/dev/null 2>&1; then
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          else
            echo "::warning::ccache is not available; building without it"
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**', 'bench/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Quick Gate (smoke)
        run: |
          chmod +x scripts/test/quick.sh
          BUILD_DIR=build CHUNKDB_WITH_TLS=OFF CHUNKDB_WERROR=ON scripts/test/quick.sh

      - name: server_integration flake guard
        if: matrix.os == 'ubuntu-latest'
        run: |
          ctest --test-dir build -R server_integration --repeat until-fail:5 --output-on-failure

  build-and-test-tls-ubuntu:
    name: Build and Test TLS (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ccache only speeds up builds: without it they run uncached.
      - name: Install ccache
        timeout-minutes: 12
        run: |
          scripts/ci/apt-install.sh ccache || true
          if command -v ccache >/dev/null 2>&1; then
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          else
            echo "::warning::ccache is not available; building without it"
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-tls-ccache-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**', 'bench/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-tls-ccache-

      - name: Install OpenSSL Development Packages
        timeout-minutes: 12
        run: scripts/ci/apt-install.sh libssl-dev openssl

      - name: Quick Gate (smoke, TLS ON)
        run: |
          chmod +x scripts/test/quick.sh
          BUILD_DIR=build CHUNKDB_WITH_TLS=ON CHUNKDB_WERROR=ON scripts/test/quick.sh

      - name: server_integration flake guard
        run: |
          ctest --test-dir build -R server_integration --repeat until-fail:5 --output-on-failure

      - name: TLS Server Startup Smoke Test
        run: |
          mkdir -p tls-smoke
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout tls-smoke/key.pem \
            -out tls-smoke/cert.pem \
            -subj "/CN=127.0.0.1"

          ./build/chunkdb_server \
            --listen-uri chunks://127.0.0.1:4542/ \
            --auth none \
            --tls-cert tls-smoke/cert.pem \
            --tls-key tls-smoke/key.pem \
            --data-dir ./tls-smoke/data \
            --durability relaxed \
            --workers 2 &

          server_pid=$!
          sleep 2

          if ! kill -0 "$server_pid"; then
            echo "chunkdb_server failed to stay up in TLS mode"
            wait "$server_pid"
            exit 1
          fi

          kill "$server_pid"
          wait "$server_pid" || true

  sanitizer-asan-ubsan:
    name: ASan+UBSan (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-asan-ubsan
          -DCMAKE_BUILD_TYPE=Debug
          -DCHUNKDB_BUILD_TESTS=ON
          -DCHUNKDB_WITH_TLS=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan-ubsan --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Smoke Tests
        run: ctest --test-dir build-asan-ubsan -L smoke --output-on-failure

  sanitizer-tsan:
    name: TSan (Ubuntu 24.04, GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DCHUNKDB_BUILD_TESTS=ON
          -DCHUNKDB_WITH_TLS=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Smoke Tests
        run: >
          ctest --test-dir build-tsan
          -L smoke
          -E "process_lock|durability_kill_recovery"
          --output-on-failure

  build-and-test-windows:
    name: Build and Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          platform-check-severity: warn
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Quick Gate (smoke)
        shell: msys2 {0}
        run: |
          chmod +x scripts/test/quick.sh
          BUILD_DIR=build CHUNKDB_WITH_TLS=OFF CHUNKDB_WERROR=ON CMAKE_GENERATOR=Ninja scripts/test/quick.sh || {
            echo "---- build/Testing/Temporary/LastTest.log ----"
            cat build/Testing/Temporary/LastTest.log || true
            if [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
              echo "---- build/Testing/Temporary/LastTestsFailed.log ----"
              cat build/Testing/Temporary/LastTestsFailed.log
              while IFS= read -r failed; do
                if [ -n "$failed" ]; then
                  echo "::error title=ctest-failed::$failed"
                fi
              done < build/Testing/Temporary/LastTestsFailed.log
            fi
            exit 1
          }

      - name: Benchmark Snapshot (Windows)
        shell: msys2 {0}
        run: |
          ./build/chunkdb_bench --ops 20000 > bench-windows-direct.txt
          ./build/chunkdb_server_bench \
            --server-mode spawn \
            --host 127.0.0.1 \
            --port 4242 \
            --clients 50 \
            --pipeline 1 \
            --requests 5000 \
            --tests ping,set,get,chunkgetstate,mixed \
            --keyspace 512 \
            --seed 1337 \
            > bench-windows-server.txt

          echo "---- BEGIN BENCH WINDOWS DIRECT ----"
          cat bench-windows-direct.txt
          echo "---- END BENCH WINDOWS DIRECT ----"

          echo "---- BEGIN BENCH WINDOWS SERVER ----"
          cat bench-windows-server.txt
          echo "---- END BENCH WINDOWS SERVER ----"

          sparse_line=$(grep -m1 "sparse_world_writes" bench-windows-direct.txt || true)
          if [ -n "$sparse_line" ]; then
            echo "$sparse_line"
            echo "::notice title=windows-bench::$sparse_line"
          else
            echo "::warning::sparse_world_writes line not found in benchmark output"
          fi

  build-and-test-windows-tls:
    name: Build and Test TLS (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          platform-check-severity: warn
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl

      - name: Quick Gate (smoke, TLS ON)
        shell: msys2 {0}
        run: |
          chmod +x scripts/test/quick.sh
          BUILD_DIR=build-tls CHUNKDB_WITH_TLS=ON CHUNKDB_WERROR=ON CMAKE_GENERATOR=Ninja scripts/test/quick.sh || {
            echo "---- build-tls/Testing/Temporary/LastTest.log ----"
            cat build-tls/Testing/Temporary/LastTest.log || true
            if [ -f build-tls/Testing/Temporary/LastTestsFailed.log ]; then
              echo "---- build-tls/Testing/Temporary/LastTestsFailed.log ----"
              cat build-tls/Testing/Temporary/LastTestsFailed.log
              while IFS= read -r failed; do
                if [ -n "$failed" ]; then
                  echo "::error title=ctest-failed::$failed"
                fi
              done < build-tls/Testing/Temporary/LastTestsFailed.log
            fi
            exit 1
          }

      - name: Verify OpenSSL Was Linked
        shell: msys2 {0}
        # CMake only warns when OpenSSL is missing and builds the server without
        # TLS, which would make the smoke test below a false pass.
        run: |
          if ! grep -q '^FIND_PACKAGE_MESSAGE_DETAILS_OpenSSL:INTERNAL=\[' build-tls/CMakeCache.txt; then
            echo "OpenSSL was not found by CMake; the server was built without TLS"
            grep -i openssl build-tls/CMakeCache.txt || true
            exit 1
          fi

      - name: TLS Server HELLO + PING Smoke Test
        shell: msys2 {0}
        run: |
          mkdir -p tls-smoke
          # MSYS2 rewrites arguments that look like Unix paths ("/CN=..." and
          # URIs) into Windows paths; disable that for these two commands.
          MSYS2_ARG_CONV_EXCL="*" openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout tls-smoke/key.pem \
            -out tls-smoke/cert.pem \
            -subj "/CN=127.0.0.1"

          MSYS2_ARG_CONV_EXCL="*" ./build-tls/chunkdb_server \
            --listen-uri chunks://127.0.0.1:4542/ \
            --auth none \
            --tls-cert tls-smoke/cert.pem \
            --tls-key tls-smoke/key.pem \
            --data-dir ./tls-smoke/data \
            --durability relaxed \
            --workers 2 \
            > tls-smoke/server.log 2>&1 &

          server_pid=$!
          sleep 3

          if ! kill -0 "$server_pid"; then
            echo "chunkdb_server failed to stay up in TLS mode"
            cat tls-smoke/server.log
            wait "$server_pid"
            exit 1
          fi

          { printf 'HELLO 3\r\nPING\r\n'; sleep 2; } \
            | openssl s_client -connect 127.0.0.1:4542 -quiet 2>tls-smoke/s_client.err \
            | tr -d '\r' > tls-smoke/s_client.out || true

          echo "---- s_client output ----"
          cat tls-smoke/s_client.out

          kill "$server_pid"
          wait "$server_pid" || true

          if ! grep -q 'tls=on' tls-smoke/server.log; then
            echo "server did not report tls=on in its effective config"
            cat tls-smoke/server.log
            exit 1
          fi

          if ! grep -qx 'protocol' tls-smoke/s_client.out || ! grep -qx ':3' tls-smoke/s_client.out || ! grep -qx '+PONG' tls-smoke/s_client.out; then
            echo "expected the HELLO reply and +PONG over TLS"
            echo "---- s_client stderr ----"
            cat tls-smoke/s_client.err
            echo "---- server log ----"
            cat tls-smoke/server.log
            exit 1
          fi

  docker-quickstart:
    name: Docker quick-start page
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          repository: chunkdb/chunk-cli
          ref: main
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Build CLI
        working-directory: cli
        run: nice -n 10 go build -o "$GITHUB_WORKSPACE/page-bin/chunk-cli" ./cmd/chunk-cli
      - name: Check page command extraction
        run: python3 scripts/test/docker-quickstart-test.py
      - name: Build Docker image (Release, WERROR, TLS)
        run: nice -n 10 docker build -t chunkdb:quickstart-ci .
      - name: Run commands from QUICK_START.md
        run: python3 scripts/test/docker-quickstart.py --cli page-bin/chunk-cli --logs docker-quickstart-logs
      - name: Upload page check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-quickstart-logs
          path: docker-quickstart-logs
          if-no-files-found: warn

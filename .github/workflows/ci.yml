name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCHUNKDB_BUILD_TESTS=ON
          -DCHUNKDB_WITH_TLS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-and-test-tls-ubuntu:
    name: Build and Test TLS (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSSL Development Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev openssl

      - name: Configure (TLS ON)
        run: >
          cmake -S . -B build
          -DCHUNKDB_BUILD_TESTS=ON
          -DCHUNKDB_WITH_TLS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: TLS Server Startup Smoke Test
        run: |
          mkdir -p tls-smoke
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout tls-smoke/key.pem \
            -out tls-smoke/cert.pem \
            -subj "/CN=127.0.0.1"

          ./build/chunkdb_server \
            --listen-uri chunks://smoke-token@127.0.0.1:4542/ \
            --tls-cert tls-smoke/cert.pem \
            --tls-key tls-smoke/key.pem \
            --data-dir ./tls-smoke/data \
            --durability relaxed \
            --workers 2 &

          server_pid=$!
          sleep 2

          if ! kill -0 "$server_pid"; then
            echo "chunkdb_server failed to stay up in TLS mode"
            wait "$server_pid"
            exit 1
          fi

          kill "$server_pid"
          wait "$server_pid" || true

  build-and-test-windows:
    name: Build and Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: >
          cmake -S . -B build
          -G Ninja
          -DCHUNKDB_BUILD_TESTS=ON
          -DCHUNKDB_WITH_TLS=OFF

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark Sparse Snapshot (Windows)
        shell: msys2 {0}
        run: |
          ./build/chunkdb_bench --ops 20000 > bench-windows.txt
          sparse_line=$(grep -m1 "sparse_world_writes" bench-windows.txt || true)
          if [ -n "$sparse_line" ]; then
            echo "$sparse_line"
            echo "::notice title=windows-bench::$sparse_line"
          else
            echo "::warning::sparse_world_writes line not found in benchmark output"
          fi

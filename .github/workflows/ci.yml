name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quick Gate (smoke)
        run: |
          chmod +x scripts/test/quick.sh
          BUILD_DIR=build CHUNKDB_WITH_TLS=OFF scripts/test/quick.sh

  build-and-test-tls-ubuntu:
    name: Build and Test TLS (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSSL Development Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev openssl

      - name: Quick Gate (smoke, TLS ON)
        run: |
          chmod +x scripts/test/quick.sh
          BUILD_DIR=build CHUNKDB_WITH_TLS=ON scripts/test/quick.sh

      - name: TLS Server Startup Smoke Test
        run: |
          mkdir -p tls-smoke
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout tls-smoke/key.pem \
            -out tls-smoke/cert.pem \
            -subj "/CN=127.0.0.1"

          ./build/chunkdb_server \
            --listen-uri chunks://smoke-token@127.0.0.1:4542/ \
            --tls-cert tls-smoke/cert.pem \
            --tls-key tls-smoke/key.pem \
            --data-dir ./tls-smoke/data \
            --durability relaxed \
            --workers 2 &

          server_pid=$!
          sleep 2

          if ! kill -0 "$server_pid"; then
            echo "chunkdb_server failed to stay up in TLS mode"
            wait "$server_pid"
            exit 1
          fi

          kill "$server_pid"
          wait "$server_pid" || true

  build-and-test-windows:
    name: Build and Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Quick Gate (smoke)
        shell: msys2 {0}
        run: |
          chmod +x scripts/test/quick.sh
          BUILD_DIR=build CHUNKDB_WITH_TLS=OFF CMAKE_GENERATOR=Ninja scripts/test/quick.sh || {
            echo "---- build/Testing/Temporary/LastTest.log ----"
            cat build/Testing/Temporary/LastTest.log || true
            if [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
              echo "---- build/Testing/Temporary/LastTestsFailed.log ----"
              cat build/Testing/Temporary/LastTestsFailed.log
              while IFS= read -r failed; do
                if [ -n "$failed" ]; then
                  echo "::error title=ctest-failed::$failed"
                fi
              done < build/Testing/Temporary/LastTestsFailed.log
            fi
            exit 1
          }

      - name: Benchmark Snapshot (Windows)
        shell: msys2 {0}
        run: |
          ./build/chunkdb_bench --ops 20000 > bench-windows-direct.txt
          ./build/chunkdb_server_bench --ops 5000 --port 4242 > bench-windows-server.txt

          echo "---- BEGIN BENCH WINDOWS DIRECT ----"
          cat bench-windows-direct.txt
          echo "---- END BENCH WINDOWS DIRECT ----"

          echo "---- BEGIN BENCH WINDOWS SERVER ----"
          cat bench-windows-server.txt
          echo "---- END BENCH WINDOWS SERVER ----"

          sparse_line=$(grep -m1 "sparse_world_writes" bench-windows-direct.txt || true)
          if [ -n "$sparse_line" ]; then
            echo "$sparse_line"
            echo "::notice title=windows-bench::$sparse_line"
          else
            echo "::warning::sparse_world_writes line not found in benchmark output"
          fi

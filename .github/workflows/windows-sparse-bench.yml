name: Windows Sparse Low-Cache Benchmark

on:
  workflow_dispatch:

jobs:
  sparse-low-cache-single:
    name: Sparse Low-Cache run=${{ matrix.run_id }} (windows-latest)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        run_id: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build benchmark binaries
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCHUNKDB_BUILD_TESTS=OFF \
            -DCHUNKDB_WITH_TLS=OFF
          cmake --build build --target chunkdb_server chunkdb_server_bench

      - name: Run sparse low-cache benchmark
        shell: msys2 {0}
        run: |
          set -euo pipefail

          OUT_DIR="bench-artifacts/windows-sparse-run-${GITHUB_RUN_ID}-${{ matrix.run_id }}"
          mkdir -p "$OUT_DIR"
          PORT=$((4240 + ${{ matrix.run_id }}))

          run_ok=0
          for attempt in 1 2 3; do
            DATA_DIR="$OUT_DIR/data-attempt-$attempt"
            mkdir -p "$DATA_DIR"

            ./build/chunkdb_server \
              --listen-uri "chunk://bench@127.0.0.1:${PORT}/" \
              --data-dir "$DATA_DIR" \
              --durability relaxed \
              --log-level warn \
              --max-loaded-chunks 8192 \
              --wal-group-commit-updates 8 \
              > "$OUT_DIR/server-attempt-$attempt.log" 2>&1 &
            server_pid=$!

            ready=0
            for _ in $(seq 1 50); do
              if ./build/chunkdb_server_bench \
                --server-mode external \
                --host 127.0.0.1 \
                --port "$PORT" \
                --token bench \
                --tests ping \
                --requests 1 \
                --clients 1 \
                --pipeline 1 \
                --output human \
                >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 0.1
            done

            if [ "$ready" -ne 1 ]; then
              echo "server did not become ready run=${{ matrix.run_id }} attempt=$attempt port=$PORT"
              cat "$OUT_DIR/server-attempt-$attempt.log" || true
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
              continue
            fi

            set +e
            bench_out=$(./build/chunkdb_server_bench \
              --server-mode external \
              --host 127.0.0.1 \
              --port "$PORT" \
              --token bench \
              --tests set \
              --requests 20000 \
              --clients 50 \
              --pipeline 1 \
              --keyspace 200000 \
              --output human)
            bench_rc=$?
            set -e

            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true

            echo "$bench_out" > "$OUT_DIR/bench-attempt-$attempt.txt"
            if [ $bench_rc -ne 0 ]; then
              echo "Benchmark run=${{ matrix.run_id }} attempt=$attempt failed"
              cat "$OUT_DIR/bench-attempt-$attempt.txt"
              continue
            fi

            thr=$(printf "%s\n" "$bench_out" | sed -n 's/^Throughput (req\/s): //p')
            lat=$(printf "%s\n" "$bench_out" | sed -n 's/^Latency (ms): avg=.* p50=\([0-9.]*\) p95=\([0-9.]*\) p99=\([0-9.]*\) max=.*/\1,\2,\3/p')
            dur=$(printf "%s\n" "$bench_out" | sed -n 's/^Completed Requests: [0-9]*  Duration(s): \([0-9.]*\).*/\1/p')

            echo "run,throughput,p50,p95,p99,duration_s" > "$OUT_DIR/metrics.csv"
            echo "${{ matrix.run_id }},$thr,$lat,$dur" >> "$OUT_DIR/metrics.csv"
            echo "run=${{ matrix.run_id }} attempt=$attempt throughput=$thr p50/p95/p99=$lat duration_s=$dur"
            run_ok=1
            break
          done

          if [ "$run_ok" -ne 1 ]; then
            echo "run=${{ matrix.run_id }} failed after 3 attempts"
            exit 1
          fi

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-sparse-low-cache-run-${{ matrix.run_id }}-${{ github.run_id }}
          path: bench-artifacts/windows-sparse-run-${{ github.run_id }}-${{ matrix.run_id }}
          if-no-files-found: error

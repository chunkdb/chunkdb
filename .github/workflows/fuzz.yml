name: Parser fuzz smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  parser-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        timeout-minutes: 12
        run: scripts/ci/apt-install.sh clang
      - name: Build instrumented local harnesses
        run: |
          cmake -S . -B build/fuzz -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCHUNKDB_FUZZ=ON \
            -DCHUNKDB_BUILD_TESTS=OFF -DCHUNKDB_WITH_TLS=OFF -DCHUNKDB_WERROR=ON
          cmake --build build/fuzz -j 3 --target chunkdb_fuzz_cql chunkdb_fuzz_request \
            chunkdb_fuzz_chunk_form chunkdb_fuzz_manifest chunkdb_fuzz_slots \
            chunkdb_fuzz_migrations chunkdb_fuzz_backup
      - name: Bounded parser sessions
        run: |
          for name in cql request chunk_form manifest slots migrations backup; do
            build/fuzz/fuzz/bin/chunkdb_fuzz_$name build/fuzz/fuzz/corpus/$name \
              -max_total_time=30 -timeout=10 -rss_limit_mb=2048 \
              -max_len=1048576 -artifact_prefix=build/fuzz/ -print_final_stats=1
          done
      - name: Keep failure artifacts and evolved corpora
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parser-fuzz-failure
          path: |
            build/fuzz/crash-*
            build/fuzz/timeout-*
            build/fuzz/oom-*
            build/fuzz/fuzz/corpus/
          if-no-files-found: ignore
